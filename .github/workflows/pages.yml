name: deploy-pages
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - claude/dpiptv-test-setup-fqxhvb
    paths:
      - player.html
      - .github/workflows/pages.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Build site
        run: |
          mkdir -p _site
          cp player.html _site/index.html
          cp player.html _site/player.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
